[tool.poetry]
name = "lambdaprecisionudggenerator"
version = "0.1.0"
description = ""
authors = ["foerster_work <foerster.work@gmail.com>"]
readme = "README.md"
license = "EUPL-1.2"
packages = [{ include = "lambdaprecisionudggenerator", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = "^2.3.2"
matplotlib = "^3.10.5"
joblib = "^1.4.2"
networkx = "^3.4.2"
scipy = "^1.16.1"
pyomo = "^6.8.2"
tikzplotlib = "^0.10.1"
tabulate = "^0.9.0"
gurobipy = "^12.0.3"
pandas = "^2.3.1"
distinctipy = "^1.3.4"
pyqt6 = "^6.8.0"
multiset = "^3.1.0"
tikzplotlib-patched = "^0.10.1.post13"
python-markdown-math = "^0.9"
poetry-core = "^2.1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.0.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
pre-commit = "^4.0.1"
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.11"
mkdocs-include-markdown-plugin = "^7.1.5"
mkdocs-dracula-theme = "^1.0.7"
mkdocstrings = { extras = ["python"], version = "^0.29.1" }
mkdocs-bibtex = "^4.2.5"
types-tabulate = "^0.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
disable_error_code = ["import-untyped"]

# Per-module options
[[tool.mypy.overrides]]
module = [
    "pyomo.*",
    "gurobipy.*",
    "tikzplotlib.*",
    "distinctipy.*",
    "joblib.*",
    "scipy.*",
    "multiset.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=lambdaprecisionudggenerator",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-branch",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
