[tool.poetry]
name = "lambdaprecisionudggenerator"
version = "0.1.0"
description = ""
authors = ["foerster_work <foerster.work@gmail.com>"]
readme = "README.md"
packages = [{ include = "*", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = "^2.3.2"
matplotlib = "^3.10.5"
joblib = "*"
networkx = "*"
scipy = "^1.16.1"
pyomo = "*"
tikzplotlib = "*"
tabulate = "*"
gurobipy = "^12.0.3"
pandas = "^2.3.1"
distinctipy = "*"
pyqt6 = "*"
multiset = "*"
tikzplotlib-patched = "^0.10.1.post13"
cloudpickle = "^3.1.1"
python-markdown-math = "^0.9"
poetry-core = "^2.1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
black = "^23.7.0"
flake8 = "^6.1.0"
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.11"
mkdocs-include-markdown-plugin = "^7.1.5"
mkdocs-dracula-theme = "^1.0.7"
mkdocstrings = { extras = ["python"], version = "^0.29.1" }
mkdocs-bibtex = "^4.2.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
